name: Build QuickScanner5S

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract QuickScanner5S project
        run: |
          set -eux

          rm -rf build_project
          mkdir -p build_project

          ZIP_FILE=$(find . -type f -name '*.zip' -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Using ZIP: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d build_project
          else
            echo "No ZIP found. Using repository files directly."
            cp -R . build_project
          fi

      - name: Find Android project
        run: |
          set -eux

          echo "Searching for Gradle settings file..."

          PROJECT_DIR=$(find build_project \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Files extracted:"
            find build_project -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          echo "Project directory:"
          pwd
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle.kts -o -f settings.gradle
          test -d app
          test -f app/build.gradle.kts -o -f app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickScanner5S-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
