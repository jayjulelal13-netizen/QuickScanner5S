name: Build QuickScanner5S FINAL

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK
        run: |
          set -eux
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Extract FINAL project
        run: |
          set -eux
          rm -rf build_project
          mkdir -p build_project
          unzip -q QuickScanner5S_CANDLE_ENGINE_FINAL.zip -d build_project
      - name: Find Android project
        run: |
          set -eux
          PROJECT_DIR=$(find build_project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Fix candle detector and 5S engine
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          candle = root / 'app/src/main/java/com/example/screener/CandleAnalyzer.kt'
          text = candle.read_text()

          start = text.index('    private fun detectCandles(')
          end = text.rfind('\n    }\n\n\n}')
          if end <= start:
              raise SystemExit('detectCandles function boundary not found')

          new_detector = r'''    private fun detectCandles(
        bitmap: Bitmap
    ): List<DetectedCandle> {
        val width = bitmap.width
        val height = bitmap.height
        if (width < 300 || height < 500) return emptyList()

        // Chart-only region.  The top/bottom UI and the right price labels are
        // excluded as much as possible; the remaining region contains candle
        // bodies and wicks.
        val top = (height * 0.12f).toInt().coerceIn(0, height - 1)
        val bottom = (height * 0.72f).toInt().coerceIn(top + 1, height)
        val chartRight = (width * 0.92f).toInt().coerceIn(1, width - 1)
        if (bottom - top < 220 || chartRight < 200) return emptyList()

        // Reject non-chart screens before doing expensive pixel work.
        var samples = 0
        var darkSamples = 0
        for (y in top until bottom step 6) {
            for (x in 0..chartRight step 6) {
                val p = bitmap.getPixel(x, y)
                val r = Color.red(p)
                val g = Color.green(p)
                val b = Color.blue(p)
                val luma = (299 * r + 587 * g + 114 * b) / 1000
                samples++
                if (luma <= 110) darkSamples++
            }
        }
        if (samples < 250 || darkSamples.toDouble() / samples.toDouble() < 0.60) {
            return emptyList()
        }

        // Candle BODY columns are wide and have much more coloured pixels than
        // a one-pixel wick.  Detect runs of body columns instead of individual
        // vertical peaks; this prevents one candle's wick/body from becoming
        // multiple fake candles.
        val columnCount = IntArray(chartRight + 1)
        for (x in 0..chartRight) {
            var count = 0
            for (y in top until bottom) {
                val p = bitmap.getPixel(x, y)
                if (isGreen(p) || isRed(p)) count++
            }
            columnCount[x] = count
        }

        val bodyThreshold = max(5, min(18, ((bottom - top) * 0.009f).roundToInt()))
        val runs = mutableListOf<Pair<Int, Int>>()
        var runStart = -1
        var lastGood = -1
        for (x in 0..chartRight) {
            if (columnCount[x] >= bodyThreshold) {
                if (runStart < 0) runStart = x
                lastGood = x
            } else if (runStart >= 0) {
                if (lastGood - runStart + 1 >= 2) runs.add(runStart to lastGood)
                runStart = -1
                lastGood = -1
            }
        }
        if (runStart >= 0 && lastGood - runStart + 1 >= 2) {
            runs.add(runStart to lastGood)
        }

        // Remove extremely thin/tall UI strokes and merge only tiny body gaps.
        val filteredRuns = mutableListOf<Pair<Int, Int>>()
        for (r in runs) {
            val w = r.second - r.first + 1
            if (w <= 2 || w > 24) continue
            if (filteredRuns.isNotEmpty()) {
                val prev = filteredRuns.last()
                val gap = r.first - prev.second - 1
                val prevW = prev.second - prev.first + 1
                if (gap <= max(1, prevW / 4)) {
                    filteredRuns[filteredRuns.lastIndex] = prev.first to r.second
                    continue
                }
            }
            filteredRuns.add(r)
        }
        if (filteredRuns.size < MIN_SEQUENCE) return emptyList()

        val medianWidth = filteredRuns.map { it.second - it.first + 1 }
            .sorted()[filteredRuns.size / 2].toDouble()
        val widthRuns = filteredRuns.filter {
            val w = it.second - it.first + 1
            w.toDouble() in medianWidth * 0.45..medianWidth * 1.80
        }
        if (widthRuns.size < MIN_SEQUENCE) return emptyList()

        val candles = mutableListOf<Candidate>()
        for ((runLeft, runRight) in widthRuns) {
            val center = (runLeft + runRight) / 2
            val half = max(2, ((runRight - runLeft + 1) * 0.65f).roundToInt())
            val left = (center - half).coerceAtLeast(0)
            val right = (center + half).coerceAtMost(chartRight)

            var green = 0
            var red = 0
            var highY = bottom
            var lowY = top
            for (x in left..right) {
                for (y in top until bottom) {
                    val p = bitmap.getPixel(x, y)
                    if (isGreen(p)) {
                        green++
                        highY = min(highY, y)
                        lowY = max(lowY, y)
                    } else if (isRed(p)) {
                        red++
                        highY = min(highY, y)
                        lowY = max(lowY, y)
                    }
                }
            }
            val total = green + red
            if (total < 12 || highY >= lowY) continue

            val bullish = green >= red
            val rowCounts = IntArray(bottom - top)
            for (x in left..right) {
                for (y in top until bottom) {
                    val p = bitmap.getPixel(x, y)
                    val same = if (bullish) isGreen(p) else isRed(p)
                    if (same) rowCounts[y - top]++
                }
            }

            val bodyThresholdRows = max(2, ((runRight - runLeft + 1) * 0.45f).roundToInt())
            var bodyTop = bottom
            var bodyBottom = top
            for (i in rowCounts.indices) {
                if (rowCounts[i] >= bodyThresholdRows) {
                    val y = top + i
                    bodyTop = min(bodyTop, y)
                    bodyBottom = max(bodyBottom, y)
                }
            }
            if (bodyTop >= bodyBottom) continue

            val span = lowY - highY + 1
            val bodySpan = bodyBottom - bodyTop + 1
            if (span < MIN_SPAN || bodySpan < 2) continue

            val high = (bottom - highY).toDouble()
            val low = (bottom - lowY).toDouble()
            val bodyHigh = (bottom - bodyTop).toDouble()
            val bodyLow = (bottom - bodyBottom).toDouble()
            val open = if (bullish) bodyLow else bodyHigh
            val close = if (bullish) bodyHigh else bodyLow
            if (high <= low || open !in low..high || close !in low..high) continue

            candles.add(
                Candidate(
                    candle = DetectedCandle(open, high, low, close, bullish),
                    center = center,
                    width = runRight - runLeft + 1,
                    span = span
                )
            )
        }

        if (candles.size < MIN_SEQUENCE) return emptyList()
        return candles.sortedBy { it.center }
            .takeLast(MAX_CANDLES)
            .map { it.candle }
    }'''

          text = text[:start] + new_detector + text[end:]
          candle.write_text(text)

          capture = root / 'app/src/main/java/com/example/screener/CaptureService.kt'
          c = capture.read_text()
          old = '''        val probability =
            if (direction == "CALL" || direction == "PUT") {
                quickHistoricalProbability(direction)
            } else null'''
          new = '''        // 5S confidence is a deterministic setup score. It is NOT a
        // guaranteed win probability. The hard 90-point gate remains below.
        val probability =
            if (direction == "CALL" || direction == "PUT") {
                quickSetupConfidence(
                    direction,
                    base,
                    microStrength,
                    microBull,
                    microBear
                )
            } else 0'''
          if old not in c:
              raise SystemExit('quick probability block not found')
          c = c.replace(old, new, 1)

          marker = '    private fun quickHistoricalProbability(\n'
          helper = r'''    private fun quickSetupConfidence(
        direction: String,
        base: AnalysisResult?,
        microStrength: Double,
        microBull: Boolean,
        microBear: Boolean
    ): Int {
        if (direction != "CALL" && direction != "PUT") return 0
        var score = 0
        if (base != null && base.signal.equals(direction, ignoreCase = true)) score += 35
        val microAligned =
            (direction == "CALL" && microBull) ||
            (direction == "PUT" && microBear)
        if (microAligned) score += 30
        score += (microStrength.coerceIn(0.0, 1.0) * 25.0).roundToInt()
        val candleAligned =
            (direction == "CALL" && base?.bullish == true) ||
            (direction == "PUT" && base?.bullish == false)
        if (candleAligned) score += 10
        return score.coerceIn(0, 100)
    }

'''
          if marker not in c:
              raise SystemExit('quick engine insertion marker not found')
          c = c.replace(marker, helper + marker, 1)
          c = c.replace('"Win Probability: ${probability}%"', '"Confidence: ${probability}%"')
          c = c.replace('"Win Probability: $probability%"', '"Confidence: $probability%"')
          capture.write_text(c)

          # Keep the UI wording honest: this number is setup confidence, not
          # a statistically established win probability.
          for p in root.rglob('*.kt'):
              s = p.read_text()
              s = s.replace('Win Probability', 'Confidence')
              s = s.replace('Win Prob', 'Confidence')
              p.write_text(s)
          PY
          GRADLE_FILE=app/build.gradle.kts
          sed -i 's/applicationId = "com.example.screener"/applicationId = "com.example.screener.final5s"/' "$GRADLE_FILE"
          grep -n "applicationId" "$GRADLE_FILE"
      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          test -d app
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickScanner5S-FINAL-INSTALLABLE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
