name: Build QuickScanner5S SAFE RELEASE

permissions:
  contents: write
# 5S confidence build fix

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK
        run: |
          set -eux
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Extract FINAL project
        run: |
          set -eux
          rm -rf build_project
          mkdir -p build_project
          unzip -q QuickScanner5S_CANDLE_ENGINE_FINAL.zip -d build_project
      - name: Find Android project
        run: |
          set -eux
          PROJECT_DIR=$(find build_project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"
      - name: Export source for root-cause fix
        run: |
          set -eux
          rm -rf debug-source
          mkdir -p debug-source
          cp -r "$PROJECT_DIR/app/src/main/java/com/example/screener" debug-source/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-source
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Export QuickScanner5S source for debugging"
            git push
          fi
      - name: Apply final candle + 5S engine fix
        run: |
          set -eux
          python3 patch_final5s.py || echo "Legacy patch verification warning; continue with final V13/V15 patches"
          python3 patch_v13_activity.py
          python3 patch_v15_activity.py
          python3 patch_v18_final.py
          python3 patch_v19_compile.py
          python3 patch_v20_candle_types.py
          python3 patch_v21_activity.py
          python3 patch_v22_activity.py
          python3 patch_v23_activity.py
          grep -n "applicationId" "$PROJECT_DIR/app/build.gradle.kts"
          grep -nE "val top|val bottom|chartRight|minDistance|halfWindow" "$PROJECT_DIR/app/src/main/java/com/example/screener/CandleAnalyzer.kt"
          grep -nE "val probability|WAIT - 90% GATE|quickActivityScore|V21 quick activity" "$PROJECT_DIR/app/src/main/java/com/example/screener/CaptureService.kt"
      - name: Sanitize Android manifest
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest=Path('app/src/main/AndroidManifest.xml')
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          root=ET.parse(manifest).getroot()
          blocked={'android.permission.REQUEST_INSTALL_PACKAGES','android.permission.INSTALL_PACKAGES','android.permission.REQUEST_DELETE_PACKAGES','android.permission.QUERY_ALL_PACKAGES','android.permission.READ_SMS','android.permission.RECEIVE_SMS','android.permission.SEND_SMS','android.permission.READ_CALL_LOG','android.permission.WRITE_CALL_LOG','android.permission.READ_CONTACTS','android.permission.WRITE_CONTACTS','android.permission.READ_PHONE_STATE','android.permission.READ_PHONE_NUMBERS','android.permission.PACKAGE_USAGE_STATS','android.permission.MANAGE_EXTERNAL_STORAGE'}
          for child in list(root):
              if child.tag.endswith('uses-permission') and child.attrib.get('{'+ns+'}name') in blocked: root.remove(child)
          for app in root.findall('application'):
              for service in list(app):
                  if service.tag.endswith('service') and service.attrib.get('{'+ns+'}permission','') in {'android.permission.BIND_ACCESSIBILITY_SERVICE','android.permission.BIND_NOTIFICATION_LISTENER_SERVICE'}: app.remove(service)
          ET.indent(root,space='    '); ET.ElementTree(root).write(manifest,encoding='utf-8',xml_declaration=True)
          PY
      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          test -d app
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Re-sign APK as release-style package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=app/build/outputs/apk/release/QuickScanner5S.apk
          KEYSTORE=$RUNNER_TEMP/quickscanner5s-release.jks
          echo '' | base64 -d > "$KEYSTORE"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f 4 "$APK" "$OUT"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks "$KEYSTORE" --ks-pass pass:quickscanner5s --key-pass pass:quickscanner5s --ks-key-alias quickscanner5s "$OUT"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$OUT"
      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          test -f app/build/outputs/apk/release/QuickScanner5S.apk
          ls -lh app/build/outputs/apk/release/QuickScanner5S.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/QuickScanner5S.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/QuickScanner5S.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickScanner5S-FINAL-INSTALLABLE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/QuickScanner5S.apk
          if-no-files-found: error
