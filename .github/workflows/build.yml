name: Build QuickScanner5S FINAL

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK
        run: |
          set -eux
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Extract FINAL project
        run: |
          set -eux
          rm -rf build_project
          mkdir -p build_project
          unzip -q QuickScanner5S_CANDLE_ENGINE_FINAL.zip -d build_project
      - name: Find Android project
        run: |
          set -eux
          PROJECT_DIR=$(find build_project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Fix Kotlin compile issue and install identity
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          FILE=app/src/main/java/com/example/screener/CandleAnalyzer.kt
          sed -i 's/val pitch = if (gaps.size >= 4)/val pitch: Double = if (gaps.size >= 4)/' "$FILE"
          sed -i 's/max(7.0, span \/ 70.0)/(if (span \/ 70.0 > 7.0) span \/ 70.0 else 7.0)/g' "$FILE"
          sed -i '/leftGap >/c\        if (!((leftGap.toString().toDoubleOrNull() ?: 0.0) > 12.95 \&\& (rightGap.toString().toDoubleOrNull() ?: 0.0) > 12.95)) {' "$FILE"
          GRADLE_FILE=app/build.gradle.kts
          sed -i 's/applicationId = "com.example.screener"/applicationId = "com.example.screener.final5s"/' "$GRADLE_FILE"
          grep -n "applicationId" "$GRADLE_FILE"
          grep -n "val pitch\|leftGap\|rightGap" "$FILE" | tail -n 8
      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          test -d app
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickScanner5S-FINAL-INSTALLABLE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
