name: Build QuickScanner5S FINAL

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          set -eux
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Extract FINAL project
        run: |
          set -eux
          rm -rf build_project
          mkdir -p build_project
          unzip -q QuickScanner5S_CANDLE_ENGINE_FINAL.zip -d build_project

      - name: Find Android project
        run: |
          set -eux
          PROJECT_DIR=$(find build_project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Apply final candle + 5S engine fix
        run: |
          set -eux
          python3 patch_final5s.py
          grep -n "applicationId" "$PROJECT_DIR/app/build.gradle.kts"
          grep -nE "val top|val bottom|chartRight|minDistance|halfWindow" "$PROJECT_DIR/app/src/main/java/com/example/screener/CandleAnalyzer.kt"
          grep -nE "val probability|val canTrade|WAIT - 90% SETUP" "$PROJECT_DIR/app/src/main/java/com/example/screener/CaptureService.kt"

      - name: Require real chart before candle scan
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/screener/CaptureService.kt')
          s = p.read_text()
          old = '''        val detected =
            try {

                CandleAnalyzer
                    .detectVisibleCandles(
                        bitmap
                    )

            } catch (e: Exception) {'''
          new = '''        // Hard pre-gate: colored UI elements alone are not a chart.
        // Require colored candle pixels distributed across the chart width.
        val chartLeft = (bitmap.width * 0.02f).toInt().coerceAtLeast(0)
        val chartRight = (bitmap.width * 0.82f).toInt().coerceAtMost(bitmap.width - 1)
        val chartTop = (bitmap.height * 0.10f).toInt().coerceAtLeast(0)
        val chartBottom = (bitmap.height * 0.74f).toInt().coerceAtMost(bitmap.height)
        var coloredPixels = 0
        val binHits = IntArray(12)
        if (chartRight > chartLeft && chartBottom > chartTop) {
            for (y in chartTop until chartBottom step 4) {
                for (x in chartLeft..chartRight step 3) {
                    val pixel = bitmap.getPixel(x, y)
                    val r = Color.red(pixel)
                    val g = Color.green(pixel)
                    val b = Color.blue(pixel)
                    val green = g >= 80 && g > r + 20 && g > b + 10
                    val red = r >= 80 && r > g + 20 && r > b + 10
                    if (green || red) {
                        coloredPixels++
                        val bin = (((x - chartLeft) * 12) / maxOf(1, chartRight - chartLeft)).coerceIn(0, 11)
                        binHits[bin]++
                    }
                }
            }
        }
        val activeBins = binHits.count { it >= 3 }
        if (coloredPixels < 90 || activeBins < 5) {
            resetWhenChartIsMissing()
            sendCandleCount(0)
            sendStatus("NO_CHART_WAITING")
            return
        }

        val detected =
            try {

                CandleAnalyzer
                    .detectVisibleCandles(
                        bitmap
                    )

            } catch (e: Exception) {'''
          if old not in s:
              raise SystemExit('chart pre-gate insertion point not found')
          p.write_text(s.replace(old, new, 1))
          print('real-chart pre-gate installed')
          PY

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          test -d app
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eux
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickScanner5S-FINAL-INSTALLABLE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
